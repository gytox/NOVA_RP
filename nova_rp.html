<!DOCTYPE html>
<html>
<head>
    <title>NOVA RP — My First Game!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d1a;
            font-family: 'Quicksand', sans-serif;
            color: #c0c0c0;
            min-height: 100vh;
        }

        /* Simple top bar */
        .topbar {
            background: #12122a;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e1e3a;
        }

        .topbar .logo {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.1em;
            color: #7b7fff;
            letter-spacing: 2px;
        }

        .topbar .status {
            font-size: 0.75em;
            color: #555;
        }

        .topbar .status .dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #44ff44;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* Main content */
        .main {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 25px;
            text-align: center;
        }

        /* Game title */
        .game-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 2em;
            color: #7b7fff;
            margin-bottom: 5px;
            letter-spacing: 3px;
        }

        .game-subtitle {
            font-size: 1em;
            color: #666;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Screenshot placeholder */
        .screenshot {
            width: 100%;
            height: 300px;
            background: #161630;
            border: 2px dashed #2a2a4a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            color: #444;
            font-size: 0.9em;
        }

        .screenshot .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .screenshot .note {
            font-size: 0.75em;
            color: #333;
        }

        /* About section */
        .about {
            background: #12122a;
            border: 1px solid #1e1e3a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: left;
        }

        .about h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9em;
            color: #7b7fff;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .about p {
            font-size: 0.9em;
            line-height: 1.7;
            color: #888;
        }

        /* Features list */
        .features {
            background: #12122a;
            border: 1px solid #1e1e3a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: left;
        }

        .features h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9em;
            color: #7b7fff;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            padding: 8px 0;
            color: #777;
            font-size: 0.9em;
            border-bottom: 1px solid #1a1a30;
        }

        .features li:last-child { border-bottom: none; }

        .features li::before {
            content: '▸ ';
            color: #555;
        }

        /* Dev note */
        .dev-note {
            background: #1a1a2e;
            border-left: 3px solid #7b7fff;
            border-radius: 0 8px 8px 0;
            padding: 18px 22px;
            margin-bottom: 25px;
            font-size: 0.85em;
            color: #666;
            line-height: 1.6
